<style>
/* Layout: one phone-width column (max 480px), fixed bottom tab bar, dark sewer-at-night look */
:root {
  --bg: #101412;
  --bar: #151A17;
  --surface: #1A201C;
  --surface-2: #26302A;
  --line: #2E3832;
  --fg: #EEF2EC;
  --muted: #9AA49D;
  --dim: #5E6862;
  --green: #5BD27A;
  --green-hi: #8BE6A2;
  --orange: #F29A3A;
  --sauce-bg: #2A2116;
  --sauce-line: #5A3E1E;
  --bad: #E8735A;
  --font: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--green); }
a:hover { color: var(--green-hi); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
button { font-family: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.3px; }
h2 { font-size: 18px; font-weight: 800; }
p { margin: 0; }
.app { max-width: 480px; margin: 0 auto; padding-block: 24px calc(104px + env(safe-area-inset-bottom, 0px)); position: relative; }
.rel { position: relative; z-index: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 1px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head p { color: var(--muted); font-size: 14px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.link { font-size: 13px; font-weight: 600; text-decoration: none; }
.card { background: var(--surface); border: 1px solid #2A3A2F; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.empty { background: var(--surface); border-radius: 14px; padding: 14px 16px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 10px 12px; }

/* buttons */
.btn { min-height: 44px; padding: 0 18px; border-radius: 22px; border: none; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-primary { background: var(--green); color: var(--bg); }
.btn-primary:hover { background: var(--green-hi); color: var(--bg); }
.btn-sauce { background: var(--orange); color: var(--bg); }
.btn-sauce:hover { color: var(--bg); filter: brightness(1.08); }
.btn-outline { background: transparent; border: 1px solid var(--green); color: var(--green); font-weight: 600; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 600; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 13px; white-space: nowrap; }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--fg); flex-shrink: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--bg); font-weight: 800; }

/* home */
.hero-bg { position: absolute; top: -24px; left: 0; right: 0; height: 250px; z-index: 0; pointer-events: none; overflow: hidden; }
.hero-bg svg { display: block; width: 100%; height: 100%; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
.count-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count-title { font-size: 21px; font-weight: 800; min-width: 0; }
.tile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; min-height: 52px; font-size: 14px; font-weight: 700; }
.tile:hover { color: var(--fg); border-color: var(--line); }
.tile-sauce { background: var(--sauce-bg); border-color: var(--sauce-line); }
.tile svg { flex-shrink: 0; }

/* news */
.news-list { display: flex; flex-direction: column; }
.news-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid #1F2723; text-decoration: none; color: var(--fg); }
.news-row:last-child { border-bottom: none; }
.news-row:hover { color: var(--fg); }
.news-row:hover .news-title { color: var(--green-hi); }
.news-title { font-size: 15px; font-weight: 600; }

/* videos */
.vid-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vid { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--fg); min-width: 0; }
.thumb { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; background: var(--surface-2); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.vid-title { font-size: 13px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.featured .thumb { border-radius: 16px; }
.play { position: absolute; width: 56px; height: 56px; border-radius: 28px; background: var(--green); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.embed { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 16px; }

/* title rows (watch, games) */
.rows { display: flex; flex-direction: column; }
.trow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #1F2723; }
.trow:last-child { border-bottom: none; }
.trow-col { flex-direction: column; align-items: stretch; gap: 8px; }
.trow-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.trow-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.trow-title { font-size: 15px; font-weight: 600; }
.tracker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mini { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: transparent; font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.rating { display: flex; align-items: center; margin-left: -8px; }
.slice-btn { width: 36px; height: 36px; border: none; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 18px; }

/* games */
.trivia-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.streak { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.streak span { font-size: 11px; font-weight: 600; color: var(--orange); }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.badge { display: flex; align-items: center; gap: 10px; min-width: 0; }
.badge-ico { width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--line); }
.badge.on .badge-ico { background: var(--sauce-bg); border-color: var(--orange); }
.badge-name { font-size: 13px; font-weight: 700; }
.badge:not(.on) .badge-name { color: var(--muted); }

/* trivia */
.q-text { font-size: 21px; font-weight: 800; line-height: 1.25; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { min-height: 52px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--green); }
.opt.right { border-color: var(--green); background: #173222; }
.opt.wrong { border-color: var(--bad); background: #321C17; }
.opt:disabled { cursor: default; }
.progress-slices { display: flex; gap: 2px; flex-wrap: wrap; }

/* shop */
.wish-form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0 12px; font: inherit; }
.field input:focus { border-color: var(--green); outline: none; }

/* picker */
.picker-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pizza { width: min(272px, 78vw); height: min(272px, 78vw); transition: transform 1.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
.pizza svg { width: 100%; height: 100%; display: block; }

/* settings */
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--green); margin: 0; flex-shrink: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1F2723; font-size: 15px; }
.kv:last-child { border-bottom: none; }
.share-url { width: 100%; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 0 10px; font: inherit; font-size: 13px; }
.qr { align-self: center; background: var(--fg); padding: 12px; border-radius: 12px; }
.qr img, .qr canvas { display: block; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* loader */
.loader { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 0 8px; }
.w { transform-origin: 36px 36px; animation: slicein 2.4s ease-out infinite; opacity: 0; }
@keyframes slicein { 0% { opacity: 0; transform: scale(0.4); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
.skel { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--surface); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar); border-top: 1px solid var(--surface-2);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-inner { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 50px; min-height: 48px; padding-top: 4px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { color: var(--green); }

.run-wrap { width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.run-canvas { display: block; width: 100%; touch-action: manipulation; -webkit-user-select: none; user-select: none; cursor: pointer; }
#drop-canvas { touch-action: none; }
.ebay-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ebay-card { display: flex; flex-direction: column; gap: 4px; min-width: 0; text-decoration: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.ebay-card:hover { color: var(--fg); border-color: var(--green); }
.ebay-img { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.ebay-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ebay-tag { position: absolute; left: 6px; top: 6px; background: var(--orange); color: var(--bg); font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
.ebay-title { font-size: 12px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ebay-price { font-size: 15px; font-weight: 800; color: var(--orange); }
.ebay-skel { display: block; height: 10px; border-radius: 5px; background: var(--surface-2); }
.row-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.discuss { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none; }
.discuss:hover { color: var(--fg); border-color: var(--green); }
.trow-main .discuss { align-self: flex-start; margin-top: 4px; }
.topic-row { text-decoration: none; color: var(--fg); align-items: center; }
.topic-row:hover { color: var(--fg); }
.topic-row:hover .trow-title { color: var(--green-hi); }
.giscus-box { min-height: 120px; }
.giscus-box iframe { width: 100%; border: 0; }
.shop-banner { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 360 / 170; max-width: 100%; }
.shop-banner svg { display: block; width: 100%; height: 100%; }
.cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cat-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; min-height: 76px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; color: var(--fg); }
.cat-tile:hover { border-color: var(--green); }
.cat-tile[aria-pressed="true"] { border-color: var(--green); background: #173222; color: var(--green-hi); }
.cat-ico { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
.store-badge { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: #EEF2EC; font-weight: 800; font-size: 14px; letter-spacing: 0.3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.cover { flex-shrink: 0; display: block; border-radius: 8px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset; }
.row-btns { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; max-height: 82vh; overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sheet .trow { border-bottom-color: var(--surface-2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 22px; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .w { animation: none; opacity: 1; }
  .pizza { transition: none; }
}
</style>

      c.fillStyle = '#9AA49D'; c.font = '600 14px Archivo, Arial, sans-serif'; c.fillText(sub, w / 2, h / 2);
      if (DROP.state === 'over') {
        c.fillStyle = '#F29A3A'; c.font = '700 16px Archivo, Arial, sans-serif'; c.fillText('Score ' + DROP.score, w / 2, h / 2 + 26);
        c.fillStyle = '#9AA49D'; c.font = '600 13px Archivo, Arial, sans-serif'; c.fillText('Tap to play again', w / 2, h / 2 + 50);
      } else if (DROP.state === 'ready') {
        c.fillStyle = '#9AA49D'; c.font = '600 13px Archivo, Arial, sans-serif'; c.fillText('Catch pizza. Dodge whatever Mo throws.', w / 2, h / 2 + 24);
      }
      c.textBaseline = 'top';
    }
  }
  document.addEventListener('keydown', function (e) {
    if (current() !== 'drop') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); DROP.keys = e.key === 'ArrowLeft' ? -1 : 1; DROP.targetX = null; if (DROP.state !== 'running') dropTap(); }
    else if (e.code === 'Space' || e.key === ' ') { if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) return; e.preventDefault(); if (DROP.state !== 'running') dropTap(); }
  });
  document.addEventListener('keyup', function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') DROP.keys = 0; });
  /* Slide anywhere on the screen: the box follows your finger's movement, not its position */
  var dropDrag = null;
  document.addEventListener('pointerdown', function (e) {
    if (current() !== 'drop' || DROP.state !== 'running') return;
    if (e.target.closest && e.target.closest('a, input, textarea, select, .tabs')) return;
    dropDrag = { id: e.pointerId, x: e.clientX, box: DROP.boxX };
    DROP.targetX = null; DROP.keys = 0;
  });
  document.addEventListener('pointermove', function (e) {
    if (!dropDrag || e.pointerId !== dropDrag.id || DROP.state !== 'running') return;
    DROP.boxX = Math.max(BOX_W / 2 + 4, Math.min(DROP.w - BOX_W / 2 - 4, dropDrag.box + (e.clientX - dropDrag.x) * 1.2));
  });
  function endDrag(e) { if (dropDrag && (!e || e.pointerId === dropDrag.id)) dropDrag = null; }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  document.addEventListener('touchmove', function (e) { if (current() === 'drop' && DROP.state === 'running') e.preventDefault(); }, { passive: false });
  document.addEventListener('visibilitychange', function () { if (document.hidden && DROP.state === 'running') { DROP.state = 'paused'; dropUI(); } });
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (current() === 'drop') dropInit(); }, 150); });

  /* ---------- Community: topic threads stored in GitHub Discussions (giscus) ---------- */
  var TOPICS = [
    { id: 'general', name: 'General', about: 'Say hi and talk about anything turtles.', tint: '#1F4D4A', icon: '<path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5"></path>' },
    { id: 'shows', name: 'Shows & Movies', about: 'Favorite series, best episodes, movie rankings.', tint: '#273E63', icon: '<rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path>' },
    { id: 'games', name: 'Games', about: 'Tips, high scores and what you are playing.', tint: '#4A2C55', icon: '<rect x="2" y="7" width="20" height="11" rx="4"></rect><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"></path>' },
    { id: 'collecting', name: 'Collecting', about: 'Figures, finds, hauls and what to look for.', tint: '#6E5414', icon: '<rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M12 7l1.5 3 3.4.5-2.5 2.4.6 3.4L12 14.7l-3 1.6.6-3.4-2.5-2.4 3.4-.5z"></path>' },
    { id: 'comics', name: 'Comics', about: 'Current runs, classic issues, The Last Ronin.', tint: '#6B2E24', icon: '<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"></path>' },
    { id: 'events', name: 'Events', about: 'Cons, signings, tours and meetups.', tint: '#3B5A2E', icon: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>' },
    { id: 'app', name: 'Sewer Pizza app', about: 'Ideas, bugs and requests for this app.', tint: '#5A2F3E', icon: '<path d="M3 6c6-3 12-3 18 0L12 22z"></path>' }
  ];
  function topicIcon(t, size) { return '<span class="cat-ico" style="background:' + t.tint + ';width:' + size + 'px;height:' + size + 'px"><svg width="' + Math.round(size * 0.5) + '" height="' + Math.round(size * 0.5) + '" viewBox="0 0 24 24" fill="none" stroke="#EEF2EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + t.icon + '</svg></span>'; }
  VIEWS.talk = function () {
    var cfg = D.library && D.library.settings && D.library.settings.community;
    var ready = cfg && cfg.repoId && cfg.categoryId;
    return '<div class="stack-lg">' + head('Community', 'Talk with other fans. Pick a topic to read and post.') +
      (ready || loading ? '' : '<div class="note">Community is almost ready. Posting opens as soon as setup on GitHub is finished.</div>') +
      '<div class="rows">' + TOPICS.map(function (t) {
        return '<a class="trow topic-row" href="#talk-' + t.id + '">' + topicIcon(t, 44) + '<div class="trow-main" style="flex:1"><div class="trow-title">' + esc(t.name) + '</div><div class="muted small">' + esc(t.about) + '</div></div><span class="muted" aria-hidden="true">›</span></a>';
      }).join('') + '</div>' +
      '<section class="card" style="gap:8px"><h2 style="font-size:16px">House rules</h2><p class="muted" style="font-size:14px">Be kind. Warn before spoilers. No selling or spam. Keep it friendly for all ages.</p>' +
      '<p class="muted small">Posting uses a free GitHub account, which is for people 13 and older. Anyone can read without signing in.</p></section>' +
      '<p class="muted small">Every series, movie and game also has its own thread. Look for <strong style="color:var(--fg)">Discuss</strong> on the Watch and Games screens.</p></div>';
  };
  function threadInfo() {
    var h = location.hash.replace('#talk-', '');
    if (h.indexOf('t-') === 0) {
      var id = h.slice(2), lib = D.library || {};
      var t = (lib.shows || []).concat(lib.movies || []).concat(lib.games || []).filter(function (x) { return x.id === id; })[0];
      if (!t) return null;
      var kind = t.years ? 'series' : t.year ? 'movie' : 'game';
      var label = t.title + (t.year ? ' (' + t.year + ')' : t.years ? ' (' + String(t.years).slice(0, 4) + ' series)' : '');
      return { term: 'Title: ' + label, title: label, about: 'Talk about this ' + (kind === 'game' ? 'game' : kind === 'movie' ? 'movie' : 'series') + '.', back: kind === 'game' ? 'games' : 'watch', item: t, kind: kind };
    }
    var topic = TOPICS.filter(function (x) { return x.id === h; })[0];
    if (!topic) return null;
    return { term: 'Topic: ' + topic.name, title: topic.name, about: topic.about, back: 'talk', topic: topic };
  }
  VIEWS.thread = function () {
    if (loading) return '<div class="stack-lg">' + head('Community', '', 'talk') + loader('Opening the thread...') + '</div>';
    var info = threadInfo();
    if (!info) return '<div class="stack-lg">' + head('Community', '', 'talk') + '<div class="empty">That thread could not be found. <a class="link" href="#talk">Back to Community</a></div></div>';
    var art = info.topic ? topicIcon(info.topic, 52) : cover(info.item, info.kind, 52);
    return '<div class="stack-lg">' + head(info.title, '', info.back) +
      '<div style="display:flex;gap:12px;align-items:center">' + art + '<p class="muted" style="font-size:14px">' + esc(info.about) + ' Sign in with GitHub to post. Reading is open to everyone.</p></div>' +
      '<div id="giscus-box" class="giscus-box"></div></div>';
  };
  function mountGiscus() {
    var box = document.getElementById('giscus-box'); if (!box) return;
    var info = threadInfo(); if (!info) return;
    var cfg = D.library && D.library.settings && D.library.settings.community;
    if (!cfg || !cfg.repoId || !cfg.categoryId) {
      box.innerHTML = '<div class="empty"><strong style="color:var(--fg)">Posting opens soon.</strong>This thread is ready, and comments switch on as soon as setup on GitHub is finished.</div>';
      return;
    }
    box.innerHTML = '<div class="muted small" style="padding:8px 0">Loading comments...</div>';
    var sc = document.createElement('script');
    sc.src = 'https://giscus.app/client.js';
    var attrs = { 'data-repo': cfg.repo, 'data-repo-id': cfg.repoId, 'data-category': cfg.category, 'data-category-id': cfg.categoryId,
      'data-mapping': 'specific', 'data-term': info.term, 'data-strict': '1', 'data-reactions-enabled': '1', 'data-emit-metadata': '0',
      'data-input-position': 'top', 'data-theme': 'noborder_dark', 'data-lang': 'en', 'data-loading': 'lazy' };
    Object.keys(attrs).forEach(function (k) { sc.setAttribute(k, attrs[k]); });
    sc.crossOrigin = 'anonymous'; sc.async = true;
    sc.onload = function () { var m = box.querySelector('.muted'); if (m) m.remove(); };
    sc.onerror = function () { box.innerHTML = '<div class="empty">Comments could not load. Check your connection and try again.</div>'; };
    box.appendChild(sc);
  }

  /* ---------- router ---------- */
  var view = document.getElementById('view');
  function current() { var h = location.hash.replace('#', ''); if (/^talk-[a-z0-9-]+$/.test(h)) return 'thread'; return VIEWS[h] ? h : 'home'; }
  var TAB_FOR = { thread: 'talk', trivia: 'games', run: 'games', drop: 'games', picker: 'home', prefs: 'home' };
  function render() {
    var r = current();
    view.innerHTML = VIEWS[r]();
    var tab = TAB_FOR[r] || r;
    document.querySelectorAll('.tab').forEach(function (t) {
      if (t.getAttribute('data-view') === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    if (r === 'prefs' && ui.qr) drawQR();
    if (r === 'thread') mountGiscus();
    if (r === 'run') runInit(); else runStop();
    if (r === 'drop') dropInit(); else dropStop();
    renderSheet();
  }
  var lastFocus = null;
  function renderSheet() {
    var box = document.getElementById('sheet');
    box.innerHTML = sheetHTML();
    document.body.style.overflow = ui.sheet ? 'hidden' : '';
    if (ui.sheet) { var c = box.querySelector('.sheet .icon-btn'); if (c) c.focus(); }
  }
  function closeSheet() { ui.sheet = null; renderSheet(); if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
  window.addEventListener('hashchange', function () { ui.feedback = null; ui.resetAsk = false; ui.playing = false; ui.sheet = null; render(); window.scrollTo(0, 0); });

  function loadEbay() {
    var helper = D.library && D.library.settings && D.library.settings.ebaySearch;
    if (!helper || !ui.findQuery) return;
    var term = findTerm(ui.findQuery);
    if (ui.ebay && ui.ebay.term === term && ui.ebay.state !== 'error') return;
    ui.ebay = { term: term, state: 'loading', items: [] };
    fetch(helper + (helper.indexOf('?') >= 0 ? '&' : '?') + 'q=' + encodeURIComponent(term))
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!ui.ebay || ui.ebay.term !== term) return;
        ui.ebay = res.ok ? { term: term, state: 'done', items: res.d.items || [], total: res.d.total } : { term: term, state: 'error', error: res.d.error || 'eBay search did not work. Try again.' };
        if (current() === 'shop') render();
      })
      .catch(function () {
        if (!ui.ebay || ui.ebay.term !== term) return;
        ui.ebay = { term: term, state: 'error', error: 'Could not reach eBay. Check your connection and try again.' };
        if (current() === 'shop') render();
      });
  }
  function showFind() {
    var r = document.getElementById('find-results');
    if (r) r.scrollIntoView({ behavior: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  function drawQR() {
    var el = document.getElementById('qr'); if (!el) return;
    if (window.QRCode) {
      try { new window.QRCode(el, { text: location.href.split('#')[0], width: 176, height: 176, colorDark: '#101412', colorLight: '#EEF2EC' }); } catch (e) { el.textContent = 'QR code unavailable.'; }
    } else { el.textContent = 'QR code unavailable right now.'; }
  }

  /* ---------- actions ---------- */
  var ACT = {
    newscat: function (el) { ui.newsCat = el.getAttribute('data-cat'); render(); },
    shopcat: function (el) { ui.shopCat = el.getAttribute('data-cat'); render(); },
    rate: function (el) {
      var id = el.getAttribute('data-id'), n = +el.getAttribute('data-n');
      S.ratings[id] = S.ratings[id] === n ? 0 : n; save(); render();
    },
    ep: function (el) {
      var id = el.getAttribute('data-id'), d = +el.getAttribute('data-d');
      var show = (D.library.shows || []).filter(function (s) { return s.id === id; })[0];
      var max = show && show.episodes ? show.episodes : Infinity;
      S.watched[id] = Math.max(0, Math.min(max, (S.watched[id] || 0) + d)); save(); render();
    },
    answer: function (el) {
      var set = dailySet(), t = todayTrivia(), idx = t.answers.length;
      if (idx >= set.length || ui.feedback) return;
      var chosen = +el.getAttribute('data-i');
      t.answers.push(chosen);
      if (chosen === set[idx].answer) award('first');
      if (t.answers.length >= set.length) {
        var last = S.streak.last, now = today();
        if (last !== now) { S.streak.count = last && dayDiff(last, now) === 1 ? S.streak.count + 1 : 1; S.streak.last = now; }
        if (score(set, t.answers) === set.length) award('cheese');
        if (S.streak.count >= 8) award('pie');
      }
      save();
      ui.feedback = { index: idx, chosen: chosen };
      render();
    },
    next: function () { ui.feedback = null; render(); window.scrollTo(0, 0); },
    unwish: function (el) { S.wishlist.splice(+el.getAttribute('data-i'), 1); save(); render(); toast('Removed from wishlist'); },
    mode: function (el) { ui.mode = el.getAttribute('data-mode'); render(); },
    spin: function () {
      if (ui.spinning) return;
      var pool = [];
      if (ui.mode !== 'movies') (D.library.shows || []).forEach(function (s) { pool.push({ kind: 'show', item: s }); });
      if (ui.mode !== 'episodes') (D.library.movies || []).forEach(function (m) { pool.push({ kind: 'movie', item: m }); });
      if (!pool.length) return;
      var choice = pool[Math.floor(Math.random() * pool.length)];
      var wedge = Math.floor(Math.random() * 8);
      ui.rot = Math.ceil(ui.rot / 360) * 360 + 1440 + (360 - (22.5 + 45 * wedge));
      ui.spinning = true; ui.pick = null;
      var pz = document.getElementById('pizza'), btn = document.getElementById('spin-btn'), res = document.getElementById('pick-result');
      if (pz) pz.style.transform = 'rotate(' + ui.rot + 'deg)';
      if (btn) btn.textContent = 'Spinning...';
      if (res) res.innerHTML = '<div class="empty" style="text-align:center">Picking...</div>';
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () {
        var it = choice.item;
        if (choice.kind === 'show') {
          var ep = it.episodes ? Math.floor(Math.random() * it.episodes) + 1 : null;
          ui.pick = { item: it, title: it.title + ' (' + it.years + ')', detail: ep ? 'Watch episode ' + ep + ' of ' + it.episodes + ', counting from the very first one.' : 'Pick any episode.' };
        } else {
          ui.pick = { item: it, title: it.title, detail: 'Movie night: the ' + it.year + ' movie.' };
        }
        ui.spinning = false;
        award('movie');
        if (current() === 'picker') render();
      }, reduce ? 50 : 1650);
    },
    copy: function () {
      var input = document.getElementById('share-url'), url = input ? input.value : location.href.split('#')[0];
      function fallback() { if (input) { input.focus(); input.select(); } toast('Select the link and copy it'); }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, fallback);
        else fallback();
      } catch (e) { fallback(); }
    },
    qr: function () { ui.qr = !ui.qr; render(); },
    'reset-ask': function () { ui.resetAsk = true; render(); },
    'reset-no': function () { ui.resetAsk = false; render(); },
    'reset-yes': function () { S = blank(); save(); ui.resetAsk = false; render(); toast('Saved data cleared'); },
    play: function () { ui.playing = true; render(); },
    watchsheet: function (el) { lastFocus = el; ui.sheet = { id: el.getAttribute('data-id'), mode: el.getAttribute('data-mode') }; renderSheet(); },
    closesheet: function () { closeSheet(); },
    runtap: function () { runTap(); },
    droptap: function () { dropTap(); },
    savewish: function () {
      var input = document.getElementById('wish-name');
      var name = ((input && input.value) || ui.findQuery || '').trim().slice(0, 80);
      if (!name) { if (input) input.focus(); toast('Type what you are looking for first'); return; }
      if (!S.wishlist.some(function (w) { return w.name.toLowerCase() === name.toLowerCase(); })) S.wishlist.push({ name: name, url: '' });
      ui.findQuery = ui.findQuery || name; save(); render(); toast('Saved to wishlist');
    },
    findwish: function (el) { var w = S.wishlist[+el.getAttribute('data-i')]; if (!w) return; ui.findQuery = w.name; render(); showFind(); loadEbay(); },
    clearfind: function () { ui.findQuery = ''; render(); },
    shuffle: function () {
      var n = ((D.library && D.library.shop && D.library.shop.ideas) || []).length; if (!n) return;
      var cur = ui.findIdx != null ? ui.findIdx : hashStr(today()) % n, next = cur;
      while (n > 1 && next === cur) next = Math.floor(Math.random() * n);
      ui.findIdx = next; render();
    },
    addstore: function () { ui.addStore = !ui.addStore; render(); if (ui.addStore) { var f = document.getElementById('store-name'); if (f) f.focus(); } },
    unstore: function (el) { S.stores.splice(+el.getAttribute('data-i'), 1); save(); render(); toast('Store removed'); }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var fn = ACT[el.getAttribute('data-act')]; if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-alert');
    if (k) { S.alerts[k] = e.target.checked; save(); toast('Saved'); return; }
    var svc = e.target.getAttribute && e.target.getAttribute('data-service');
    if (svc) {
      S.services = S.services.filter(function (x) { return x !== svc; });
      if (e.target.checked) S.services.push(svc);
      save(); toast('Saved');
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'store-form') {
      e.preventDefault();
      var sn = e.target.elements.name.value.trim(), su = e.target.elements.url.value.trim();
      if (!sn || !su) return;
      if (!/^https?:\/\//i.test(su)) su = 'https://' + su;
      S.stores.push({ name: sn.slice(0, 40), url: su }); save(); ui.addStore = false; render(); toast('Store added');
      return;
    }
    if (e.target.id !== 'wish-form') return;
    e.preventDefault();
    var name = e.target.elements.name.value.trim();
    if (!name) return;
    ui.findQuery = name.slice(0, 80);
    if (document.activeElement) document.activeElement.blur();
    render(); showFind(); loadEbay();
  });

  /* ---------- start ---------- */
  render();
  loadData().then(render, function () { loading = false; loadError = true; render(); });
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  } catch (e) { /* not supported here */ }
})();
</script>
