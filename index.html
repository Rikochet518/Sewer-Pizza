<style>
/* Layout: one phone-width column (max 480px), fixed bottom tab bar, dark sewer-at-night look */
:root {
  --bg: #101412;
  --bar: #151A17;
  --surface: #1A201C;
  --surface-2: #26302A;
  --line: #2E3832;
  --fg: #EEF2EC;
  --muted: #9AA49D;
  --dim: #5E6862;
  --green: #5BD27A;
  --green-hi: #8BE6A2;
  --orange: #F29A3A;
  --sauce-bg: #2A2116;
  --sauce-line: #5A3E1E;
  --bad: #E8735A;
  --font: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--green); }
a:hover { color: var(--green-hi); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
button { font-family: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.3px; }
h2 { font-size: 18px; font-weight: 800; }
p { margin: 0; }
.app { max-width: 480px; margin: 0 auto; padding-block: 24px calc(104px + env(safe-area-inset-bottom, 0px)); position: relative; }
.rel { position: relative; z-index: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 1px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head p { color: var(--muted); font-size: 14px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.link { font-size: 13px; font-weight: 600; text-decoration: none; }
.card { background: var(--surface); border: 1px solid #2A3A2F; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.empty { background: var(--surface); border-radius: 14px; padding: 14px 16px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 10px 12px; }

/* buttons */
.btn { min-height: 44px; padding: 0 18px; border-radius: 22px; border: none; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-primary { background: var(--green); color: var(--bg); }
.btn-primary:hover { background: var(--green-hi); color: var(--bg); }
.btn-sauce { background: var(--orange); color: var(--bg); }
.btn-sauce:hover { color: var(--bg); filter: brightness(1.08); }
.btn-outline { background: transparent; border: 1px solid var(--green); color: var(--green); font-weight: 600; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 600; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 13px; white-space: nowrap; }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--fg); flex-shrink: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--bg); font-weight: 800; }

/* home */
.hero-bg { position: absolute; top: -24px; left: 0; right: 0; height: 250px; z-index: 0; pointer-events: none; overflow: hidden; }
.hero-bg svg { display: block; width: 100%; height: 100%; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
.count-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count-title { font-size: 21px; font-weight: 800; min-width: 0; }
.tile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; min-height: 52px; font-size: 14px; font-weight: 700; }
.tile:hover { color: var(--fg); border-color: var(--line); }
.tile-sauce { background: var(--sauce-bg); border-color: var(--sauce-line); }
.tile svg { flex-shrink: 0; }

/* news */
.news-list { display: flex; flex-direction: column; }
.news-row { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid #1F2723; text-decoration: none; color: var(--fg); }
.news-row:last-child { border-bottom: none; }
.news-row:hover { color: var(--fg); }
.news-row:hover .news-title { color: var(--green-hi); }
.news-title { font-size: 15px; font-weight: 600; }

/* videos */
.vid-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vid { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--fg); min-width: 0; }
.thumb { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; background: var(--surface-2); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.vid-title { font-size: 13px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.featured .thumb { border-radius: 16px; }
.play { position: absolute; width: 56px; height: 56px; border-radius: 28px; background: var(--green); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.embed { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 16px; }

/* title rows (watch, games) */
.rows { display: flex; flex-direction: column; }
.trow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #1F2723; }
.trow:last-child { border-bottom: none; }
.trow-col { flex-direction: column; align-items: stretch; gap: 8px; }
.trow-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.trow-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.trow-title { font-size: 15px; font-weight: 600; }
.tracker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mini { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: transparent; font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.rating { display: flex; align-items: center; margin-left: -8px; }
.slice-btn { width: 36px; height: 36px; border: none; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 18px; }

/* games */
.trivia-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.streak { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.streak span { font-size: 11px; font-weight: 600; color: var(--orange); }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.badge { display: flex; align-items: center; gap: 10px; min-width: 0; }
.badge-ico { width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--line); }
.badge.on .badge-ico { background: var(--sauce-bg); border-color: var(--orange); }
.badge-name { font-size: 13px; font-weight: 700; }
.badge:not(.on) .badge-name { color: var(--muted); }

/* trivia */
.q-text { font-size: 21px; font-weight: 800; line-height: 1.25; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { min-height: 52px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--green); }
.opt.right { border-color: var(--green); background: #173222; }
.opt.wrong { border-color: var(--bad); background: #321C17; }
.opt:disabled { cursor: default; }
.progress-slices { display: flex; gap: 2px; flex-wrap: wrap; }

/* shop */
.wish-form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0 12px; font: inherit; }
.field input:focus { border-color: var(--green); outline: none; }

/* picker */
.picker-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pizza { width: min(272px, 78vw); height: min(272px, 78vw); transition: transform 1.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--green); margin: 0; flex-shrink: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1F2723; font-size: 15px; }
.kv:last-child { border-bottom: none; }
.share-url { width: 100%; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 0 10px; font: inherit; font-size: 13px; }
.qr { align-self: center; background: var(--fg); padding: 12px; border-radius: 12px; }
.qr img, .qr canvas { display: block; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.loader { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 0 8px; }
.w { transform-origin: 36px 36px; animation: slicein 2.4s ease-out infinite; opacity: 0; }

.skel { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--surface); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bar); border-top: 1px solid var(--surface-2);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-inner { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; min-height: 48px; padding-top: 4px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { color: var(--green); }

.run-wrap { width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.run-canvas { display: block; width: 100%; touch-action: manipulation; -webkit-user-select: none; user-select: none; cursor: pointer; }
.cover { flex-shrink: 0; display: block; border-radius: 8px; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset; }
.row-btns { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; max-height: 82vh; overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 22px; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .w { animation: none; opacity: 1; }
  .pizza { transition: none; }
}
</style>

    if (!RUN.hero) runReset();
    runUI();
    if (!RUN.raf) { RUN.last = performance.now(); RUN.raf = requestAnimationFrame(runFrame); }
  }
  function runStop() {
    if (RUN.raf) cancelAnimationFrame(RUN.raf);
    RUN.raf = 0; RUN.ctx = null;
    if (RUN.state === 'running') RUN.state = 'paused';
  }
  function runTap() {
    if (RUN.state === 'ready' || RUN.state === 'paused') { RUN.state = 'running'; RUN.last = performance.now(); if (RUN.hero.y === 0) jump(); runUI(); return; }
    if (RUN.state === 'over') { if (performance.now() - RUN.overAt < 450) return; runReset(); RUN.state = 'running'; jump(); runUI(); return; }
    jump();
  }
  function jump() { var hr = RUN.hero; if (hr.jumps < 2) { hr.vy = hr.jumps === 0 ? -600 : -500; hr.jumps++; } }
  function runScore() { return Math.floor(RUN.dist / 10) + RUN.peps * 25; }
  function runUI() {
    var b = document.getElementById('run-btn');
    if (b) b.textContent = RUN.state === 'running' ? 'Jump' : RUN.state === 'over' ? 'Run again' : RUN.state === 'paused' ? 'Keep going' : 'Start';
    var best = document.getElementById('run-best'); if (best) best.textContent = S.run.best;
    var plays = document.getElementById('run-plays'); if (plays) plays.textContent = S.run.plays;
  }
  function runOver() {
    RUN.state = 'over'; RUN.overAt = performance.now();
    var sc = runScore();
    S.run.plays++;
    if (sc > S.run.best) { S.run.best = sc; RUN.newBest = true; }
    save();
    if (sc >= 500) award('runner');
    if (RUN.peps >= 20) award('pepperoni');
    runUI();
  }
  function runFrame(now) {
    RUN.raf = requestAnimationFrame(runFrame);
    var dt = Math.min(0.033, (now - RUN.last) / 1000); RUN.last = now;
    if (RUN.state === 'running') runStep(dt);
    runDraw(now / 1000);
  }
  function runStep(dt) {
    RUN.t += dt;
    RUN.speed = Math.min(580, 240 + RUN.t * 9);
    var dx = RUN.speed * dt; RUN.dist += dx;
    var hr = RUN.hero;
    hr.vy += 1700 * dt; hr.y += hr.vy * dt;
    if (hr.y > 0) { hr.y = 0; hr.vy = 0; hr.jumps = 0; }
    RUN.spawnIn -= dt;
    if (RUN.spawnIn <= 0) {
      var rat = Math.random() < 0.55;
      RUN.obs.push(rat ? { kind: 'rat', x: RUN.w + 20, w: 34, h: 18, vx: 70 } : { kind: 'pipe', x: RUN.w + 20, w: 24, h: 28 + Math.random() * 20, vx: 0 });
      RUN.spawnIn = Math.max(0.6, 1.45 - RUN.t * 0.018) + Math.random() * 0.75;
    }
    RUN.itemIn -= dt;
    if (RUN.itemIn <= 0) {
      var up = 26 + Math.random() * 84, n = 1 + Math.floor(Math.random() * 3);
      for (var i = 0; i < n; i++) RUN.items.push({ x: RUN.w + 20 + i * 28, y: up });
      RUN.itemIn = 0.9 + Math.random() * 1.1;
    }
    RUN.obs.forEach(function (o) { o.x -= dx + o.vx * dt; });
    RUN.obs = RUN.obs.filter(function (o) { return o.x > -60; });
    RUN.items.forEach(function (it) { it.x -= dx; });
    var base = gy() + hr.y;
    var hb = { l: hr.x + 7, r: hr.x + 31, t: base - 44, b: base - 2 };
    for (var k = 0; k < RUN.obs.length; k++) {
      var o = RUN.obs[k], ob = { l: o.x + 4, r: o.x + o.w - 4, t: gy() - o.h + 3, b: gy() };
      if (hb.l < ob.r && hb.r > ob.l && hb.t < ob.b && hb.b > ob.t) { runOver(); return; }
    }
    RUN.items = RUN.items.filter(function (it) {
      var cx = it.x, cy = gy() - it.y;
      var hit = cx + 8 > hb.l && cx - 8 < hb.r && cy + 8 > hb.t && cy - 8 < hb.b;
      if (hit) RUN.peps++;
      return !hit && it.x > -20;
    });
  }
  function drawSlice(c, x, base, t, air) {
    var swing = air ? 0 : Math.sin(t * 20) * 5;
    c.lineCap = 'round'; c.strokeStyle = '#EEF2EC'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(x + 16, base - 14); c.lineTo(x + 16 + swing, base - 4); c.moveTo(x + 23, base - 14); c.lineTo(x + 23 - swing, base - 4); c.stroke();
    c.fillStyle = '#EEF2EC';
    c.beginPath(); c.ellipse(x + 16 + swing + 1, base - 3, 5, 3, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + 23 - swing + 1, base - 3, 5, 3, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#F2C46D'; c.strokeStyle = '#C9852E'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x + 3, base - 42); c.lineTo(x + 36, base - 42); c.lineTo(x + 19.5, base - 12); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#C9852E'; c.beginPath(); c.roundRect ? c.roundRect(x + 1, base - 47, 37, 7, 3.5) : c.rect(x + 1, base - 47, 37, 7); c.fill();
    c.fillStyle = '#B5452E'; c.beginPath(); c.ellipse(x + 19.5, base - 47, 11, 4.5, 0, Math.PI, 0); c.fill(); c.fillRect(x + 27, base - 48.5, 9, 2.4);
    c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(x + 15, base - 34, 3.4, 0, Math.PI * 2); c.arc(x + 24.5, base - 34, 3.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#101412'; c.beginPath(); c.arc(x + 16.4, base - 33.6, 1.6, 0, Math.PI * 2); c.arc(x + 25.9, base - 33.6, 1.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#B5452E'; c.beginPath(); c.arc(x + 10, base - 38.5, 1.8, 0, Math.PI * 2); c.arc(x + 20, base - 22, 1.8, 0, Math.PI * 2); c.fill();
  }
  function drawRat(c, o, base, t) {
    var x = o.x, legs = Math.sin(t * 26) * 2;
    c.strokeStyle = '#8A9490'; c.lineWidth = 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x + 30, base - 8); c.quadraticCurveTo(x + 42, base - 18, x + 46, base - 6); c.stroke();
    c.fillStyle = '#8A9490'; c.beginPath(); c.ellipse(x + 19, base - 9, 13, 8, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + 7, base - 11, 7, 5.5, -0.3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#B9A3A0'; c.beginPath(); c.arc(x + 9, base - 17, 3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#101412'; c.beginPath(); c.arc(x + 4.5, base - 12, 1.3, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#6F7A75'; c.beginPath(); c.moveTo(x + 13, base - 3); c.lineTo(x + 13 + legs, base); c.moveTo(x + 25, base - 3); c.lineTo(x + 25 - legs, base); c.stroke();
  }
  function drawPipe(c, o, base) {
    c.fillStyle = '#3B5A2E'; c.fillRect(o.x, base - o.h, o.w, o.h);
    c.fillStyle = '#4C7239'; c.fillRect(o.x - 3, base - o.h, o.w + 6, 7);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(o.x + 4, base - o.h + 8, 3, o.h - 10);
  }
  function runDraw(t) {
    var c = RUN.ctx; if (!c) return;
    var w = RUN.w, h = RUN.h, g = gy();
    c.fillStyle = '#101412'; c.fillRect(0, 0, w, h);
    var off = (RUN.dist * 0.3) % 40;
    c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 1; c.beginPath();
    for (var y = 6, row = 0; y < g; y += 20, row++) {
      c.moveTo(0, y + 0.5); c.lineTo(w, y + 0.5);
      for (var x = -off + (row % 2) * 20; x < w; x += 40) { c.moveTo(Math.round(x) + 0.5, y); c.lineTo(Math.round(x) + 0.5, Math.min(y + 20, g)); }
    }
    c.stroke();
    for (var i = 0; i < 4; i++) {
      var lx = ((i * 170 - RUN.dist * 0.3) % 680 + 680) % 680 - 40;
      if (lx < w + 60) {
        var rg = c.createRadialGradient(lx, 24, 2, lx, 24, 64);
        rg.addColorStop(0, 'rgba(242,154,58,0.32)'); rg.addColorStop(1, 'rgba(242,154,58,0)');
        c.fillStyle = rg; c.fillRect(lx - 64, 0, 128, 96);
        c.fillStyle = '#F29A3A'; c.fillRect(lx - 3, 20, 6, 6);
      }
    }
    var shade = c.createLinearGradient(0, 0, 0, g); shade.addColorStop(0, 'rgba(0,0,0,0.5)'); shade.addColorStop(0.45, 'rgba(0,0,0,0)');
    c.fillStyle = shade; c.fillRect(0, 0, w, g);
    c.fillStyle = '#2E3832'; c.fillRect(0, g, w, 8);
    c.fillStyle = '#1A201C'; c.fillRect(0, g + 8, w, 10);
    c.fillStyle = '#1C3830'; c.fillRect(0, g + 18, w, h - g - 18);
    c.strokeStyle = 'rgba(139,230,162,0.22)'; c.lineWidth = 1.5; c.beginPath();
    var woff = (RUN.dist * 0.6) % 60;
    for (var wx = -woff; wx < w; wx += 60) { c.moveTo(wx, g + 28); c.lineTo(wx + 18, g + 28); c.moveTo(wx + 30, g + 38); c.lineTo(wx + 44, g + 38); }
    c.stroke();
    RUN.items.forEach(function (it) {
      var cx = it.x, cy = g - it.y + Math.sin(t * 4 + it.x * 0.05) * 2;
      c.fillStyle = '#B5452E'; c.beginPath(); c.arc(cx, cy, 8, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#8E3322'; c.beginPath(); c.arc(cx - 3, cy - 2, 1.4, 0, Math.PI * 2); c.arc(cx + 2.5, cy - 3, 1.4, 0, Math.PI * 2); c.arc(cx + 1, cy + 3, 1.4, 0, Math.PI * 2); c.fill();
    });
    RUN.obs.forEach(function (o) { if (o.kind === 'rat') drawRat(c, o, g, t); else drawPipe(c, o, g); });
    var hr = RUN.hero;
    drawSlice(c, hr.x, g + hr.y, RUN.state === 'running' ? t : 0, hr.y < 0);
    c.font = '700 15px Archivo, Arial, sans-serif'; c.textBaseline = 'top';
    c.fillStyle = '#EEF2EC'; c.textAlign = 'left'; c.fillText('Score ' + runScore(), 12, 10);
    c.fillStyle = '#F29A3A'; c.textAlign = 'right'; c.fillText('Best ' + S.run.best, w - 12, 10);
    if (RUN.state !== 'running') {
      c.fillStyle = 'rgba(16,20,18,0.72)'; c.fillRect(0, 0, w, h);
      c.textAlign = 'center'; c.textBaseline = 'middle';
      var title = RUN.state === 'over' ? (RUN.newBest ? 'New best!' : 'Delivery dropped!') : RUN.state === 'paused' ? 'Paused' : 'Sewer Run';
      var sub = RUN.state === 'over' ? 'Score ' + runScore() + ' · ' + RUN.peps + ' pepperoni' : RUN.state === 'paused' ? 'Tap to keep going' : 'Tap to start';
      c.fillStyle = '#EEF2EC'; c.font = '800 26px Archivo, Arial, sans-serif'; c.fillText(title, w / 2, h / 2 - 18);
      c.fillStyle = RUN.state === 'over' ? '#F29A3A' : '#9AA49D'; c.font = '600 15px Archivo, Arial, sans-serif'; c.fillText(sub, w / 2, h / 2 + 14);
      if (RUN.state === 'over') { c.fillStyle = '#9AA49D'; c.font = '600 13px Archivo, Arial, sans-serif'; c.fillText('Tap to run again', w / 2, h / 2 + 38); }
      c.textBaseline = 'top';
    }
  }
  document.addEventListener('keydown', function (e) {
    if (current() !== 'run') return;
    if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp') {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      e.preventDefault(); runTap();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && RUN.state === 'running') { RUN.state = 'paused'; runUI(); } });
  var resizeTimer;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (current() === 'run') runInit(); }, 150); });

  /* ---------- router ---------- */
  var view = document.getElementById('view');
  function current() { var h = location.hash.replace('#', ''); return VIEWS[h] ? h : 'home'; }
  var TAB_FOR = { trivia: 'games', run: 'games', picker: 'home', prefs: 'home' };
  function render() {
    var r = current();
    view.innerHTML = VIEWS[r]();
    var tab = TAB_FOR[r] || r;
    document.querySelectorAll('.tab').forEach(function (t) {
      if (t.getAttribute('data-view') === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    if (r === 'prefs' && ui.qr) drawQR();
    if (r === 'run') runInit(); else runStop();
    renderSheet();
  }
  var lastFocus = null;
  function renderSheet() {
    var box = document.getElementById('sheet');
    box.innerHTML = sheetHTML();
    document.body.style.overflow = ui.sheet ? 'hidden' : '';
    if (ui.sheet) { var c = box.querySelector('.sheet .icon-btn'); if (c) c.focus(); }
  }
  function closeSheet() { ui.sheet = null; renderSheet(); if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ui.sheet) closeSheet(); });
  window.addEventListener('hashchange', function () { ui.feedback = null; ui.resetAsk = false; ui.playing = false; ui.sheet = null; render(); window.scrollTo(0, 0); });

  function drawQR() {
    var el = document.getElementById('qr'); if (!el) return;
    if (window.QRCode) {
      try { new window.QRCode(el, { text: location.href.split('#')[0], width: 176, height: 176, colorDark: '#101412', colorLight: '#EEF2EC' }); } catch (e) { el.textContent = 'QR code unavailable.'; }
    } else { el.textContent = 'QR code unavailable right now.'; }
  }

  /* ---------- actions ---------- */
  var ACT = {
    newscat: function (el) { ui.newsCat = el.getAttribute('data-cat'); render(); },
    shopcat: function (el) { ui.shopCat = el.getAttribute('data-cat'); render(); },
    rate: function (el) {
      var id = el.getAttribute('data-id'), n = +el.getAttribute('data-n');
      S.ratings[id] = S.ratings[id] === n ? 0 : n; save(); render();
    },
    ep: function (el) {
      var id = el.getAttribute('data-id'), d = +el.getAttribute('data-d');
      var show = (D.library.shows || []).filter(function (s) { return s.id === id; })[0];
      var max = show && show.episodes ? show.episodes : Infinity;
      S.watched[id] = Math.max(0, Math.min(max, (S.watched[id] || 0) + d)); save(); render();
    },
    answer: function (el) {
      var set = dailySet(), t = todayTrivia(), idx = t.answers.length;
      if (idx >= set.length || ui.feedback) return;
      var chosen = +el.getAttribute('data-i');
      t.answers.push(chosen);
      if (chosen === set[idx].answer) award('first');
      if (t.answers.length >= set.length) {
        var last = S.streak.last, now = today();
        if (last !== now) { S.streak.count = last && dayDiff(last, now) === 1 ? S.streak.count + 1 : 1; S.streak.last = now; }
        if (score(set, t.answers) === set.length) award('cheese');
        if (S.streak.count >= 8) award('pie');
      }
      save();
      ui.feedback = { index: idx, chosen: chosen };
      render();
    },
    next: function () { ui.feedback = null; render(); window.scrollTo(0, 0); },
    unwish: function (el) { S.wishlist.splice(+el.getAttribute('data-i'), 1); save(); render(); toast('Removed from wishlist'); },
    mode: function (el) { ui.mode = el.getAttribute('data-mode'); render(); },
    spin: function () {
      if (ui.spinning) return;
      var pool = [];
      if (ui.mode !== 'movies') (D.library.shows || []).forEach(function (s) { pool.push({ kind: 'show', item: s }); });
      if (ui.mode !== 'episodes') (D.library.movies || []).forEach(function (m) { pool.push({ kind: 'movie', item: m }); });
      if (!pool.length) return;
      var choice = pool[Math.floor(Math.random() * pool.length)];
      var wedge = Math.floor(Math.random() * 8);
      ui.rot = Math.ceil(ui.rot / 360) * 360 + 1440 + (360 - (22.5 + 45 * wedge));
      ui.spinning = true; ui.pick = null;
      var pz = document.getElementById('pizza'), btn = document.getElementById('spin-btn'), res = document.getElementById('pick-result');
      if (pz) pz.style.transform = 'rotate(' + ui.rot + 'deg)';
      if (btn) btn.textContent = 'Spinning...';
      if (res) res.innerHTML = '<div class="empty" style="text-align:center">Picking...</div>';
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () {
        var it = choice.item;
        if (choice.kind === 'show') {
          var ep = it.episodes ? Math.floor(Math.random() * it.episodes) + 1 : null;
          ui.pick = { item: it, title: it.title + ' (' + it.years + ')', detail: ep ? 'Watch episode ' + ep + ' of ' + it.episodes + ', counting from the very first one.' : 'Pick any episode.' };
        } else {
          ui.pick = { item: it, title: it.title, detail: 'Movie night: the ' + it.year + ' movie.' };
        }
        ui.spinning = false;
        award('movie');
        if (current() === 'picker') render();
      }, reduce ? 50 : 1650);
    },
    copy: function () {
      var input = document.getElementById('share-url'), url = input ? input.value : location.href.split('#')[0];
      function fallback() { if (input) { input.focus(); input.select(); } toast('Select the link and copy it'); }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, fallback);
        else fallback();
      } catch (e) { fallback(); }
    },
    qr: function () { ui.qr = !ui.qr; render(); },
    'reset-ask': function () { ui.resetAsk = true; render(); },
    'reset-no': function () { ui.resetAsk = false; render(); },
    'reset-yes': function () { S = blank(); save(); ui.resetAsk = false; render(); toast('Saved data cleared'); },
    play: function () { ui.playing = true; render(); },
    watchsheet: function (el) { lastFocus = el; ui.sheet = { id: el.getAttribute('data-id'), mode: el.getAttribute('data-mode') }; renderSheet(); },
    closesheet: function () { closeSheet(); },
    runtap: function () { runTap(); }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var fn = ACT[el.getAttribute('data-act')]; if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-alert');
    if (k) { S.alerts[k] = e.target.checked; save(); toast('Saved'); return; }
    var svc = e.target.getAttribute && e.target.getAttribute('data-service');
    if (svc) {
      S.services = S.services.filter(function (x) { return x !== svc; });
      if (e.target.checked) S.services.push(svc);
      save(); toast('Saved');
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'wish-form') return;
    e.preventDefault();
    var name = e.target.elements.name.value.trim(), url = e.target.elements.url.value.trim();
    if (!name) return;
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    S.wishlist.push({ name: name.slice(0, 80), url: url }); save(); render(); toast('Added to wishlist');
  });

  /* ---------- start ---------- */
  render();
  loadData().then(render, function () { loading = false; loadError = true; render(); });
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  } catch (e) { /* not supported here */ }
})();
</script>
