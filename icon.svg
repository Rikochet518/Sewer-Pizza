      <stop offset="0.55" stop-color="#D98A3A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9A246" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="0">
