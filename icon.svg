    <circle cx="283" cy="252" r="15" fill="#B5452E"/>
    <circle cx="256" cy="300" r="12" fill="#B5452E"/>
    <circle cx="228" cy="232" r="4" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle cx="279" cy="248" r="4" fill="#FFFFFF" fill-opacity="0.25"/>
    <g transform="rotate(-14 198 222)"><path d="M193.1 221.0h9.9l1.2 11.0a5.9 2.5 0 0 1 -12.4 0z" fill="#E9DFC9" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M185.0 222.0a13.0 10.4 0 0 1 26.0 0c-3.9 2.3 -18.2 2.3 -26.0 0z" fill="#D9C7A4" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M190.2 217.4a7.8 5.9 0 0 1 9.1 -3.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round"/><path d="M195.0 223.9v5.9M198.0 223.9v7.2M201.0 223.9v5.9" stroke="#B9A47F" stroke-width="1.6" stroke-linecap="round"/></g>
    <g transform="rotate(12 314 220)"><path d="M309.4 219.0h9.1l1.1 10.2a5.5 2.3 0 0 1 -11.4 0z" fill="#E9DFC9" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M302.0 220.0a12.0 9.6 0 0 1 24.0 0c-3.6 2.2 -16.8 2.2 -24.0 0z" fill="#D9C7A4" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M306.8 215.8a7.2 5.4 0 0 1 8.4 -3.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round"/><path d="M311.3 221.8v5.4M314.0 221.8v6.6M316.7 221.8v5.4" stroke="#B9A47F" stroke-width="1.6" stroke-linecap="round"/></g>
    <g transform="rotate(-6 258 264)"><path d="M254.2 263.0h7.6l0.9 8.5a4.6 1.9 0 0 1 -9.5 0z" fill="#E9DFC9" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M248.0 264.0a10.0 8.0 0 0 1 20.0 0c-3.0 1.8 -14.0 1.8 -20.0 0z" fill="#D9C7A4" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M252.0 260.5a6.0 4.5 0 0 1 7.0 -3.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round"/><path d="M255.7 265.5v4.5M258.0 265.5v5.5M260.3 265.5v4.5" stroke="#B9A47F" stroke-width="1.6" stroke-linecap="round"/></g>
    <g transform="rotate(8 256 336)"><path d="M252.6 335.0h6.8l0.9 7.6a4.1 1.7 0 0 1 -8.6 0z" fill="#E9DFC9" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M247.0 336.0a9.0 7.2 0 0 1 18.0 0c-2.7 1.6 -12.6 1.6 -18.0 0z" fill="#D9C7A4" stroke="#7A6448" stroke-width="2.5" stroke-linejoin="round"/><path d="M250.6 332.9a5.4 4.0 0 0 1 6.3 -2.7" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round"/><path d="M253.9 337.4v4.0M256.0 337.4v5.0M258.1 337.4v4.0" stroke="#B9A47F" stroke-width="1.6" stroke-linecap="round"/></g>
    <path d="M210 270c6 10 4 20-2 26M300 220c5 8 4 16-1 22" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
