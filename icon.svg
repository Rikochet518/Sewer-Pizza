      <stop offset="0.35" stop-color="#FBE6A6"/>
      <stop offset="0.7" stop-color="#F3CB6A"/>
      <stop offset="1" stop-color="#D99A3C"/>
    </linearGradient>
    <linearGradient id="cheese2" x1="0.1" y1="0" x2="0.7" y2="1">
