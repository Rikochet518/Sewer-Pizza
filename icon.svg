<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="rim" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#6F7873"/>
      <stop offset="0.6" stop-color="#4A524E"/>
      <stop offset="1" stop-color="#262C29"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5B6560"/>
      <stop offset="0.7" stop-color="#3D4642"/>
      <stop offset="1" stop-color="#2B322F"/>
    </radialGradient>
    <radialGradient id="center" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#4C5551"/>
      <stop offset="1" stop-color="#2E3532"/>
    </radialGradient>
    <pattern id="tread" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45 256 256)">
      <rect width="16" height="16" fill="none"/>
      <rect x="4" y="3" width="8" height="10" rx="1.5" fill="#7A847F" fill-opacity="0.32"/>
      <rect x="4" y="3" width="8" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="rust" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A4B2E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8A4B2E" stop-opacity="0"/>
    </radialGradient>
    <path id="ring-text" d="M256 256m-176 0a176 176 0 1 1 352 0a176 176 0 1 1 -352 0"/>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3A24C"/>
      <stop offset="0.55" stop-color="#C47E33"/>
      <stop offset="1" stop-color="#9A5A22"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FAD983"/>
      <stop offset="0.6" stop-color="#F2C25E"/>
      <stop offset="1" stop-color="#E5A944"/>
    </linearGradient>
    <linearGradient id="string" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6CF6E"/>
      <stop offset="1" stop-color="#FBE3A0"/>
    </linearGradient>
    <radialGradient id="pep" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#D2543A"/>
      <stop offset="0.7" stop-color="#B23A26"/>
      <stop offset="1" stop-color="#7E2414"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#101412"/>

  <!-- iron frame and cover -->
  <circle cx="256" cy="256" r="240" fill="#1A1F1C"/>
  <circle cx="256" cy="256" r="232" fill="url(#rim)" stroke="#1A1F1C" stroke-width="4"/>
  <circle cx="256" cy="256" r="214" fill="#161B18"/>
  <circle cx="256" cy="256" r="208" fill="url(#plate)"/>
  <circle cx="256" cy="256" r="208" fill="url(#tread)"/>

  <!-- raised rings and lettering band -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#7A847F" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#141816" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#141816" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#7A847F" stroke-opacity="0.45" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#2B322F" stroke-width="36" stroke-opacity="0.85"/>
  <g font-family="Archivo Black, Archivo, Arial Black, Arial, sans-serif" font-weight="900" font-size="25" letter-spacing="5">
    <text fill="#151917" dy="10" transform="translate(1.5 2)"><textPath xlink:href="#ring-text" startOffset="0">SEWER PIZZA • EST. 2026 • SEWER PIZZA • EST. 2026 •</textPath></text>
    <text fill="#8E9893" dy="10"><textPath xlink:href="#ring-text" startOffset="0">SEWER PIZZA • EST. 2026 • SEWER PIZZA • EST. 2026 •</textPath></text>
  </g>

  <!-- smooth center plate -->
  <circle cx="256" cy="256" r="150" fill="url(#center)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#141816" stroke-width="3"/>

  <!-- pry slots -->
  <g fill="#0B0E0C" stroke="#6F7873" stroke-opacity="0.5" stroke-width="1.5">
    <rect x="243" y="54" width="26" height="9" rx="4.5"/>
    <rect x="243" y="449" width="26" height="9" rx="4.5"/>
  </g>

  <!-- grime and rust -->
  <circle cx="132" cy="350" r="46" fill="url(#rust)"/>
  <circle cx="392" cy="170" r="34" fill="url(#rust)"/>
  <circle cx="360" cy="390" r="22" fill="url(#rust)"/>
  <path d="M110 150a190 190 0 0 1 120-90" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round"/>

  <!-- realistic pizza slice with stretchy cheese -->
  <g filter="url(#shadow)">
    <!-- cheese strings stretching down from the tip -->
    <path d="M249 330c-4 22-12 36-14 58c-1 8 4 12 8 12s7-5 6-12c-2-20 4-34 6-56z" fill="url(#string)"/>
    <path d="M262 334c1 20 6 34 4 52c-1 7 3 10 6 10s6-4 5-10c-2-18-7-32-8-52z" fill="url(#string)"/>
    <path d="M272 326c6 16 18 26 22 44c2 7 7 8 10 6s3-6 0-12c-6-16-18-26-25-40z" fill="url(#string)" opacity="0.92"/>
    <path d="M243 398c2 4 8 4 10 0" fill="none" stroke="#E5A944" stroke-width="2" stroke-linecap="round"/>
    <path d="M255 344c-2 14 2 24 0 34" fill="none" stroke="#FFF2C4" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
    <!-- cheese top -->
    <path d="M162 190c62-30 128-30 190 0L266 338c-3 6-10 6-13 0z" fill="url(#cheese)"/>
    <path d="M196 214c10-6 26-4 30 6s-10 14-20 12-14-12-10-18z" fill="#FBE3A0" fill-opacity="0.65"/>
    <path d="M292 214c8-4 20-2 22 6s-8 10-16 8-10-10-6-14z" fill="#FBE3A0" fill-opacity="0.6"/>
    <path d="M240 290c8-3 16 0 16 6s-8 8-14 6-6-9-2-12z" fill="#FBE3A0" fill-opacity="0.6"/>
    <circle cx="218" cy="262" r="6" fill="#D9933A" fill-opacity="0.45"/>
    <circle cx="306" cy="246" r="5" fill="#D9933A" fill-opacity="0.45"/>
    <circle cx="270" cy="304" r="4" fill="#D9933A" fill-opacity="0.45"/>
    <!-- cheese drooping over the side edges -->
    <path d="M196 236c-4 8-2 16 4 18s8-6 6-12" fill="url(#cheese)"/>
    <path d="M318 246c4 8 2 16-4 18s-8-6-6-12" fill="url(#cheese)"/>
    <!-- pepperoni -->
    <circle cx="226" cy="232" r="17" fill="url(#pep)"/><circle cx="226" cy="232" r="14" fill="none" stroke="#8E2A1A" stroke-opacity="0.55" stroke-width="2"/><ellipse cx="220.9" cy="226.1" rx="5.4" ry="3.1" fill="#FFFFFF" fill-opacity="0.3"/><circle cx="231.9" cy="237.1" r="1.6" fill="#5E1A0E" fill-opacity="0.7"/>
    <circle cx="290" cy="240" r="16" fill="url(#pep)"/><circle cx="290" cy="240" r="13" fill="none" stroke="#8E2A1A" stroke-opacity="0.55" stroke-width="2"/><ellipse cx="285.2" cy="234.4" rx="5.1" ry="2.9" fill="#FFFFFF" fill-opacity="0.3"/><circle cx="295.6" cy="244.8" r="1.6" fill="#5E1A0E" fill-opacity="0.7"/>
    <circle cx="258" cy="286" r="14" fill="url(#pep)"/><circle cx="258" cy="286" r="11" fill="none" stroke="#8E2A1A" stroke-opacity="0.55" stroke-width="2"/><ellipse cx="253.8" cy="281.1" rx="4.5" ry="2.5" fill="#FFFFFF" fill-opacity="0.3"/><circle cx="262.9" cy="290.2" r="1.6" fill="#5E1A0E" fill-opacity="0.7"/>
    <circle cx="204" cy="206" r="10" fill="url(#pep)"/><circle cx="204" cy="206" r="7" fill="none" stroke="#8E2A1A" stroke-opacity="0.55" stroke-width="2"/><ellipse cx="201.0" cy="202.5" rx="3.2" ry="1.8" fill="#FFFFFF" fill-opacity="0.3"/><circle cx="207.5" cy="209.0" r="1.6" fill="#5E1A0E" fill-opacity="0.7"/>
    <!-- herbs -->
    <g fill="#4F7A32">
      <circle cx="248" cy="222" r="2"/><circle cx="270" cy="262" r="1.8"/><circle cx="236" cy="266" r="1.6"/>
      <circle cx="316" cy="214" r="1.8"/><circle cx="282" cy="210" r="1.5"/><circle cx="252" cy="316" r="1.5"/>
    </g>
    <!-- crust -->
    <path d="M156 190c64-34 136-34 200 0c4 2 4 8 0 11c-64-30-136-30-200 0c-4-3-4-9 0-11z" fill="url(#crust)"/>
    <path d="M154 184c66-36 138-36 204 0c6 4 6 12 0 16c-66-32-138-32-204 0c-6-4-6-12 0-16z" fill="url(#crust)"/>
    <path d="M168 178c56-26 120-26 176 0" fill="none" stroke="#F0BE72" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
    <g fill="#6B3714" fill-opacity="0.55">
      <ellipse cx="190" cy="180" rx="5" ry="2.2" transform="rotate(-18 190 180)"/>
      <ellipse cx="232" cy="168" rx="4" ry="1.8" transform="rotate(-6 232 168)"/>
      <ellipse cx="286" cy="168" rx="5" ry="2" transform="rotate(6 286 168)"/>
      <ellipse cx="330" cy="182" rx="4" ry="1.8" transform="rotate(20 330 182)"/>
    </g>
  </g>
</svg>
